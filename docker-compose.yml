version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tokentrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokentrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokentrail_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tokentrail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokentrail} -d ${POSTGRES_DB:-tokentrail}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tokentrail-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tokentrail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tokentrail-network

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tokentrail-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app:cached
      - ./backend/alembic:/app/alembic:cached
      - ./backend/tests:/app/tests:cached
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tokentrail}:${POSTGRES_PASSWORD:-tokentrail_dev}@postgres:5432/${POSTGRES_DB:-tokentrail}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-tokentrail}:${POSTGRES_PASSWORD:-tokentrail_dev}@postgres:5432/${POSTGRES_DB:-tokentrail}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LITELLM_PROXY_URL=http://litellm:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tokentrail-network

  # LiteLLM Proxy
  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    container_name: tokentrail-litellm
    restart: unless-stopped
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/tokentrail_callback.py:/app/tokentrail_callback.py:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:-sk-litellm-salt-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tokentrail}:${POSTGRES_PASSWORD:-tokentrail_dev}@postgres:5432/${POSTGRES_DB:-tokentrail}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # TokenTrail callback configuration
      - TOKENTRAIL_API_URL=http://api:8000
      - TOKENTRAIL_INTERNAL_API_KEY=${TOKENTRAIL_INTERNAL_API_KEY:-internal-api-key}
      - TOKENTRAIL_CALLBACK_ENABLED=true
      - TOKENTRAIL_SMART_ROUTING=true
      # Add /app to Python path for custom callback
      - PYTHONPATH=/app
      - LITELLM_CALLBACKS=tokentrail_callback.tokentrail_callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tokentrail-network

  # React Frontend (Vite Dev Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tokentrail-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/vite.config.ts:/app/vite.config.ts:cached
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-8000}
      - VITE_LITELLM_URL=http://localhost:${LITELLM_PORT:-4000}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tokentrail-network

volumes:
  postgres_data:
    name: tokentrail-postgres-data
  redis_data:
    name: tokentrail-redis-data

networks:
  tokentrail-network:
    name: tokentrail-network
    driver: bridge
