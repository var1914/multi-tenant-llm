# PostgreSQL Configuration for UsageFlow
# Optimized for 1000+ concurrent users on a medium AWS instance (4-8 vCPU, 16GB RAM)
# Adjust values based on your actual instance size

#------------------------------------------------------------------------------
# CONNECTION SETTINGS
#------------------------------------------------------------------------------

# Listen on all interfaces (PgBouncer will handle external connections)
listen_addresses = '*'
port = 5432

# Max connections - Keep low since PgBouncer handles pooling
# PgBouncer will multiplex 1000+ client connections to these
max_connections = 200

# Superuser reserved connections
superuser_reserved_connections = 3

#------------------------------------------------------------------------------
# MEMORY SETTINGS
#------------------------------------------------------------------------------

# Shared buffers: 25% of RAM (for 16GB = 4GB, for 8GB = 2GB)
shared_buffers = 2GB

# Effective cache size: 75% of RAM (includes OS cache)
effective_cache_size = 6GB

# Work memory: Per-operation sort/hash memory
# Be careful - this is per-operation, not per-connection
# With complex queries: max_connections * work_mem should not exceed 25% of RAM
work_mem = 64MB

# Maintenance work memory: For VACUUM, CREATE INDEX
maintenance_work_mem = 512MB

# WAL buffers: 3% of shared_buffers, max 64MB
wal_buffers = 64MB

#------------------------------------------------------------------------------
# QUERY PLANNER
#------------------------------------------------------------------------------

# Random page cost: Lower for SSD (default 4.0)
random_page_cost = 1.1

# Effective IO concurrency: Higher for SSD
effective_io_concurrency = 200

# Parallel query settings
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Default statistics target: Higher for complex queries
default_statistics_target = 100

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
#------------------------------------------------------------------------------

# WAL level: replica for streaming replication readiness
wal_level = replica

# Checkpoint settings
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 512MB

# WAL compression (saves disk space, minimal CPU overhead)
wal_compression = on

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------

# Enable autovacuum (critical for partitioned tables)
autovacuum = on

# More aggressive autovacuum for high-write tables
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Log destination
logging_collector = on
log_destination = 'stderr'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# What to log
log_min_duration_statement = 1000  # Log queries taking > 1 second
log_checkpoints = on
log_connections = off  # PgBouncer will log these
log_disconnections = off
log_lock_waits = on
log_temp_files = 0  # Log all temp file usage
log_autovacuum_min_duration = 0  # Log all autovacuum actions

# Log format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'  # Don't log all statements (use log_min_duration_statement)

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Statement timeout (prevent runaway queries)
statement_timeout = 60000  # 60 seconds

# Lock timeout
lock_timeout = 10000  # 10 seconds

# Idle transaction timeout (PgBouncer also handles this)
idle_in_transaction_session_timeout = 30000  # 30 seconds

# Default timezone
timezone = 'UTC'

#------------------------------------------------------------------------------
# PERFORMANCE OPTIMIZATIONS FOR PARTITIONED TABLES
#------------------------------------------------------------------------------

# Enable partition pruning
enable_partition_pruning = on

# Parallel append for partitioned table scans
enable_parallel_append = on

# Constraint exclusion (helps with partitioning)
constraint_exclusion = partition

#------------------------------------------------------------------------------
# JIT COMPILATION
#------------------------------------------------------------------------------

# Enable JIT for complex queries (PostgreSQL 11+)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

#------------------------------------------------------------------------------
# REPLICATION (for future read replicas)
#------------------------------------------------------------------------------

# Max replication slots (for read replicas)
max_replication_slots = 4

# Max WAL senders
max_wal_senders = 4

# Hot standby for read replicas
hot_standby = on

#------------------------------------------------------------------------------
# SECURITY
#------------------------------------------------------------------------------

# SSL (configure in production)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# Password encryption
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# EXTENSION PRELOADING
#------------------------------------------------------------------------------

# Preload pg_stat_statements for query analysis
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements settings
pg_stat_statements.max = 10000
pg_stat_statements.track = top
pg_stat_statements.track_utility = on
pg_stat_statements.save = on
