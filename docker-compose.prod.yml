version: '3.9'

# Production Docker Compose for UsageFlow
# Optimized for 1000+ concurrent users
# Includes PgBouncer connection pooling and optimized PostgreSQL

services:
  # PostgreSQL Database - Production Optimized
  postgres:
    image: postgres:15-alpine
    container_name: usageflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usageflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-usageflow}
      # Performance tuning via environment (applied at init)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    # Don't expose directly - use PgBouncer
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usageflow} -d ${POSTGRES_DB:-usageflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - usageflow-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: usageflow-pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-usageflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-usageflow}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 25
      RESERVE_POOL_TIMEOUT: 3
      MAX_DB_CONNECTIONS: 100
      MAX_USER_CONNECTIONS: 100
      SERVER_RESET_QUERY: "DISCARD ALL"
      SERVER_CHECK_QUERY: "SELECT 1"
      SERVER_CHECK_DELAY: 30
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      CLIENT_IDLE_TIMEOUT: 300
      QUERY_TIMEOUT: 120
      QUERY_WAIT_TIMEOUT: 60
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
      STATS_PERIOD: 60
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-usageflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - usageflow-internal
      - usageflow-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Redis Cache - Production
  redis:
    image: redis:7-alpine
    container_name: usageflow-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --databases 16
      --save 900 1
      --save 300 10
      --save 60 10000
      --rdbcompression yes
      --rdbchecksum yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - usageflow-internal
      - usageflow-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # FastAPI Backend - Production (Multiple Workers)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: usageflow-api
    restart: always
    # Use Gunicorn with Uvicorn workers for production
    command: >
      gunicorn app.main:app
      --workers ${API_WORKERS:-4}
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --keep-alive 5
      --max-requests 10000
      --max-requests-jitter 1000
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
      --capture-output
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Connect via PgBouncer instead of direct PostgreSQL
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-usageflow}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-usageflow}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-usageflow}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-usageflow}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ENVIRONMENT=production
      - DEBUG=false
      - LITELLM_PROXY_URL=http://litellm:4000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - USAGEFLOW_INTERNAL_API_KEY=${USAGEFLOW_INTERNAL_API_KEY}
      # SQLAlchemy pool settings (smaller since PgBouncer handles pooling)
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - DB_POOL_RECYCLE=300
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - usageflow-internal
      - usageflow-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # LiteLLM Proxy - Production
  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    container_name: usageflow-litellm
    restart: always
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/usageflow_callback.py:/app/usageflow_callback.py:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-usageflow}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-usageflow}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USAGEFLOW_API_URL=http://api:8000
      - USAGEFLOW_INTERNAL_API_KEY=${USAGEFLOW_INTERNAL_API_KEY}
      - USAGEFLOW_CALLBACK_ENABLED=true
      - USAGEFLOW_SMART_ROUTING=true
      - PYTHONPATH=/app
      - LITELLM_CALLBACKS=usageflow_callback.usageflow_callback
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - usageflow-internal
      - usageflow-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Nginx Reverse Proxy (optional, for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: usageflow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
      - litellm
    networks:
      - usageflow-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  postgres_data:
    name: usageflow-postgres-data-prod
  redis_data:
    name: usageflow-redis-data-prod

networks:
  # Internal network (DB, Redis - not exposed)
  usageflow-internal:
    name: usageflow-internal
    driver: bridge
    internal: true
  # External network (API, Frontend)
  usageflow-network:
    name: usageflow-network
    driver: bridge
