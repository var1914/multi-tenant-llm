# TokenTrail Nginx Configuration

upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream litellm_backend {
    server litellm:4000;
    keepalive 16;
}

# HTTP - Redirect to HTTPS (uncomment after SSL setup)
# server {
#     listen 80;
#     server_name tokentrailapp.com app.tokentrailapp.com api.tokentrailapp.com;
#     return 301 https://$host$request_uri;
# }

# Main server block
server {
    listen 80;
    listen [::]:80;
    server_name tokentrailapp.com app.tokentrailapp.com api.tokentrailapp.com _;

    # SSL configuration (uncomment after certbot setup)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/tokentrailapp.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tokentrailapp.com/privkey.pem;
    # ssl_session_timeout 1d;
    # ssl_session_cache shared:SSL:50m;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (for load balancer)
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # LiteLLM proxy endpoint (for LLM requests)
    location /v1/ {
        limit_req zone=llm_limit burst=10 nodelay;

        proxy_pass http://litellm_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Longer timeout for LLM requests
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    # LiteLLM chat completions (OpenAI compatible)
    location /chat/completions {
        limit_req zone=llm_limit burst=10 nodelay;

        proxy_pass http://litellm_backend/chat/completions;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # API Documentation
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_http_version 1.1;
    }

    location /redoc {
        proxy_pass http://api_backend/redoc;
        proxy_http_version 1.1;
    }

    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        proxy_http_version 1.1;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
